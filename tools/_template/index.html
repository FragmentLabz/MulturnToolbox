<!DOCTYPE html>
<!--
  STARTER TEMPLATE FOR A NEW TOOL
  1. Copy this whole _template folder and rename the copy (e.g. "word-counter").
  2. Change the title and heading below.
  3. Build your tool's layout inside the <section class="panel">.
  4. Write what it does in script.js.
  5. Add it to tools.js so it appears on the home screen.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My New Tool · My Toolbox</title>
  <link rel="stylesheet" href="../../style.css">
</head>
<body>
  <div class="page">
    <a class="back" href="../../index.html">← All tools</a>
    <h1>✨ My New Tool</h1>
    <p class="subtitle">One line about what this tool does.</p>

    <section class="panel">
      <textarea id="input" rows="6" style="width:100%" placeholder="Type something…"></textarea>
      <p><button id="go" class="primary">Go</button></p>
      <div id="output" class="status"></div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
